services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # The app reaches Postgres at db:5432 over the compose network, so this
      # publish is only for connecting from the host. Override DB_PORT if
      # something else already owns 5432 on your machine.
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ expects a single mount at /var/lib/postgresql, not .../data.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - ./api:/app
      - api-node-modules:/app/node_modules
      - api-dist:/app/dist
    command: >
      sh -c "npx prisma generate &&
             npx prisma migrate deploy &&
             npx prisma db seed &&
             npm run dev"

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
      - web-next:/app/.next
    command: npm run dev

volumes:
  db-data:
  api-node-modules:
  api-dist:
  web-node-modules:
  web-next:
